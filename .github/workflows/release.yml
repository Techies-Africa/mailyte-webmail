# Build and publish ghcr.io/techies-africa/mailyte-webmail.
#
# A production host has no checkout of this repo, so `build:` is impossible in
# the mail server's compose -- the image must come from a registry. This
# workflow is what makes the `webmail` service in that compose deployable at
# all, and until it has run once the service stays behind
# `profiles: ["webmail"]` so an unpublished image cannot fail `docker compose
# up` for the whole mail server.
#
# Tag to release:  git tag v0.1.0 && git push origin v0.1.0

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.1.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # A published image that does not typecheck is worse than no image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.tag }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # ghcr.io, not Docker Hub: GITHUB_TOKEN is minted per run, so there is no
      # secret to create, paste or rotate.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          # arm64 as well as amd64: self-hosters run this on Apple silicon and
          # on ARM VPS instances, where a single-arch image fails with an "exec
          # format error" that never mentions architecture.
          platforms: linux/amd64,linux/arm64
          push: true
          # Only the BRANDING is baked in here. MAILBOX_API_BASE_URL is
          # deliberately absent: it is read at request time so one published
          # image serves every deployment.
          build-args: |
            NEXT_PUBLIC_BRAND_NAME=Mailyte
            NEXT_PUBLIC_BRAND_MARK=M
          # Lowercase is mandatory -- ghcr rejects uppercase in an image
          # reference, and the org is spelled Techies-Africa on GitHub.
          tags: |
            ghcr.io/techies-africa/mailyte-webmail:${{ steps.meta.outputs.version }}
            ghcr.io/techies-africa/mailyte-webmail:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
